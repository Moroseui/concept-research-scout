name: Reviewed human and agent control runner
'on':
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: discuss
      experiment:
        type: string
        required: false
        default: P001
      question:
        type: string
        required: false
        default: Summarize the evidence, limitations and next action.
      request_id:
        type: string
        required: false
        default: default
      source_sha:
        type: string
        required: false
        default: ''
      destination:
        type: string
        required: false
        default: actions-artifact
      initiator:
        type: string
        required: false
        default: human
      control:
        type: string
        required: true
    secrets:
      OPENAI_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: human-control-${{ github.ref }}-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCOUT_CI: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install fixed CLIs and system dependencies
      run: 'npm install -g @openai/codex@0.153.4 @anthropic-ai/claude-code@2.1.222

        pip install -r requirements.txt'
    - name: Verify independent adapter review
      run: python -c "from orchestrator.actions_runner import reviewed; reviewed()"
    - name: Existing hosted authentication
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      run: python scripts/actions_auth.py
    - name: Run the shared system control
      id: result
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        CONTROL: ${{ inputs.control }}
        MODE: ${{ inputs.mode }}
        EXPERIMENT: ${{ inputs.experiment }}
        QUESTION: ${{ inputs.question }}
        REQUEST_ID: ${{ inputs.request_id }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        DESTINATION: ${{ inputs.destination }}
        INITIATOR: ${{ inputs.initiator }}
      run: python -m orchestrator.human_controls --control "$CONTROL" --mode "$MODE" --experiment "$EXPERIMENT" --request
        "$QUESTION" --request-id "$REQUEST_ID" --source "${SOURCE_SHA:-$GITHUB_SHA}" --destination "$DESTINATION" --initiator
        "$INITIATOR" --output "$RUNNER_TEMP/human-result"
    - name: Save validated phone result and review evidence
      if: ${{ always() && steps.result.outputs.artifact_name != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.result.outputs.artifact_name }}
        path: ${{ runner.temp }}/human-result/
        if-no-files-found: error
        retention-days: 90
    - name: Explain infrastructure failure
      if: ${{ failure() && steps.result.outputs.artifact_name == '' }}
      run: 'echo "## BLOCKED

        A preflight or runner step failed. Open the failed step for the named gate; repair the review, dependency or existing
        authentication binding before a new request. No reviewed result is claimed." >> "$GITHUB_STEP_SUMMARY"'
    - name: Remove ephemeral auth
      if: ${{ always() }}
      run: python -c "import os,pathlib; p=pathlib.Path(os.environ.get('CODEX_HOME','/nonexistent'))/'auth.json'; p.unlink(missing_ok=True)"
