name: scout-cycle

# Runs a full scouting cycle on a GitHub-hosted runner using your Claude Max
# and ChatGPT subscriptions (no API billing when the OAuth secrets are used).
#
# Required repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` on your machine
#   CODEX_AUTH_JSON          base64 of ~/.codex/auth.json after
#                            `codex login --device-auth`
#
# Every completed stage is committed and pushed, so a 6-hour job kill or a
# rate limit costs one stage; the retry job (or the next trigger) resumes.

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: 'Tracks to run (comma-separated: baseline,wide,fiction)'
        default: 'baseline'
        required: true
      charter:
        description: 'Named charter (charters/<name>/CHARTER.md); empty = baseline'
        default: ''
        required: false
      dry_run:
        description: 'Print the plan without spending tokens'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'   # nightly 06:00 UTC; edit to taste

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
          claude --version || true
          codex --version || true

      - name: Codex auth (API key preferred; OAuth snapshot fallback)
        if: ${{ inputs.dry_run != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            # This codex CLI does not read the env var for auth
            # (observed: 401 missing bearer); materialize the key
            # into its own auth store instead.
            mkdir -p ~/.codex
            printf '{"OPENAI_API_KEY": "%s"}\n' "$OPENAI_API_KEY" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
            printf 'preferred_auth_method = "apikey"\n' >> ~/.codex/config.toml
            echo "codex auth: OPENAI_API_KEY (durable; no rotation)"
          else
            echo "codex auth: ChatGPT OAuth snapshot (single-use refresh chain)"
            mkdir -p ~/.codex
            echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
          fi

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Deterministic tests first
        run: python tests/test_orchestration.py

      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"

      - name: Run cycle (resume if one is unfinished)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCOUT_CI: '1'
        run: |
          python scout.py cycle \
            --tracks "${{ inputs.tracks || 'baseline' }}" \
            --resume-or-new \
            ${{ inputs.charter != '' && inputs.charter != null && format('--charter {0}', inputs.charter) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Push checkpoints
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "cycle: workflow checkpoint"
          if ! git pull --rebase origin ${GITHUB_REF_NAME}; then
            git rebase --abort || true
            echo "::error::rescue rebase conflicted; aborting without committing a conflicted tree"
            exit 1
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
