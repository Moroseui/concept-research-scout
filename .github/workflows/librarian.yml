name: librarian

# On-demand whole-corpus pass: connection map, stale-verdict re-audit, and
# revival scan over killed/paused ideas. Costs agent tokens per entry, so it
# is manual-only -- run it when the backlog has grown or after a wave of new
# releases might have unblocked old ideas. Outputs: a report under
# ideas/librarian-NNN/, verdict updates applied to the ledger, and proposals
# in evidence/librarian_proposals.md for future scouting cycles to adopt.

on:
  workflow_dispatch: {}

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  librarian:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Restore Codex auth
        run: |
          mkdir -p ~/.codex
          echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Deterministic tests first
        run: python tests/test_orchestration.py
      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
      - name: Run librarian pass
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_CI: '1'
        run: python scout.py librarian
      - name: Push checkpoints
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "librarian: workflow checkpoint"
          if ! git pull --rebase origin ${GITHUB_REF_NAME}; then
            git rebase --abort || true
            echo "::error::rescue rebase conflicted; aborting without committing a conflicted tree"
            exit 1
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
