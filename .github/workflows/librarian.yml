name: librarian

# On-demand whole-corpus pass: connection map, stale-verdict re-audit, and
# revival scan over killed/paused ideas. Costs agent tokens per entry, so it
# is manual-only -- run it when the backlog has grown or after a wave of new
# releases might have unblocked old ideas. Outputs: a report under
# ideas/librarian-NNN/, verdict updates applied to the ledger, and proposals
# in evidence/librarian_proposals.md for future scouting cycles to adopt.

on:
  workflow_dispatch: {}

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  librarian:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Install agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Codex auth (API key preferred; OAuth snapshot fallback)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            # This codex CLI does not read the env var for auth
            # (observed: 401 missing bearer); materialize the key
            # into its own auth store instead.
            mkdir -p ~/.codex
            printf '{"OPENAI_API_KEY": "%s"}\n' "$OPENAI_API_KEY" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
            printf 'preferred_auth_method = "apikey"\n' >> ~/.codex/config.toml
            echo "codex auth: OPENAI_API_KEY (durable; no rotation)"
          else
            echo "codex auth: ChatGPT OAuth snapshot (single-use refresh chain)"
            mkdir -p ~/.codex
            echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
          fi
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Deterministic tests first
        run: python tests/test_orchestration.py
      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
      - name: Run librarian pass
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCOUT_CI: '1'
        run: python scout.py librarian
      - name: Push checkpoints
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "librarian: workflow checkpoint"
          if ! git pull --rebase origin ${GITHUB_REF_NAME}; then
            git rebase --abort || true
            echo "::error::rescue rebase conflicted; aborting without committing a conflicted tree"
            exit 1
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
