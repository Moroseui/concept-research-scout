name: librarian

# On-demand whole-corpus pass: connection map, stale-verdict re-audit, and
# revival scan over killed/paused ideas. Costs agent tokens per entry, so it
# is manual-only -- run it when the backlog has grown or after a wave of new
# releases might have unblocked old ideas. Outputs: a report under
# ideas/librarian-NNN/, verdict updates applied to the ledger, and proposals
# in evidence/librarian_proposals.md for future scouting cycles to adopt.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed source commit (40 hex characters)'
        required: true
      destination_branch:
        description: 'Explicit permitted publication branch'
        required: true
        default: 'astra/autonomous-isles-pilot'

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  librarian:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/astra/autonomous-isles-pilot' && inputs.destination_branch == 'astra/autonomous-isles-pilot' && vars.PILOT_REMOTE_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify explicit pilot execution boundary
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
        run: python scripts/workflow_boundary.py verify --source "$SOURCE_SHA" --destination "$DESTINATION_BRANCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Campaign route required
        run: |
          echo 'BLOCKED: legacy numbered-idea workflow is not authorized for this campaign; use the campaign system commands locally.'
          exit 1
      - name: Install agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Codex auth (API key preferred; OAuth snapshot fallback)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            # This codex CLI does not read the env var for auth
            # (observed: 401 missing bearer); materialize the key
            # into its own auth store instead.
            mkdir -p ~/.codex
            printf '{"OPENAI_API_KEY": "%s"}\n' "$OPENAI_API_KEY" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
            printf 'preferred_auth_method = "apikey"\n' >> ~/.codex/config.toml
            echo "codex auth: OPENAI_API_KEY (durable; no rotation)"
          else
            echo "codex auth: ChatGPT OAuth snapshot (single-use refresh chain)"
            mkdir -p ~/.codex
            echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
          fi
      - name: Codex auth preflight (named failures, round-9)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              https://api.openai.com/v1/models)
            if [ "$code" = "401" ]; then
              echo "CODEX_CREDENTIAL_REJECTED: API key refused (401) before any scientific leg."
              exit 1
            elif [ "$code" != "200" ]; then
              echo "preflight inconclusive (HTTP $code); proceeding -- the in-run classifier names billing/limit failures on the receipt."
            else
              echo "codex preflight: API key accepted"
            fi
          elif [ -f ~/.codex/auth.json ]; then
            echo "codex preflight: OAuth snapshot present (rotating; unverifiable without consuming the chain)"
          else
            echo "CODEX_CREDENTIAL_MISSING: no API key secret and no OAuth snapshot."
            exit 1
          fi
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Deterministic tests first
        run: python tests/test_orchestration.py
      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
      - name: Run librarian pass
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCOUT_CI: '1'
        run: python scout.py librarian
      - name: Publication requires a separate checked handoff
        if: success()
        run: echo 'No automatic push. Publish only through the source/destination-bound pilot publisher after full history inspection.'
