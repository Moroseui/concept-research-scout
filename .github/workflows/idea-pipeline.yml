# Pilot quarantine: legacy model job disabled pending a reviewed campaign workflow.
name: idea-pipeline

# Phone-triggerable post-scout pipeline: shortlist the top N candidates of the
# latest completed cycle and run critique + debate on each, or target a
# specific candidate/idea. Idempotent: re-running the same button skips
# already-shortlisted candidates and stages whose artifacts exist, so it
# doubles as resume after a failure or the 6-hour job cap.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed source commit (40 hex characters)'
        required: true
      destination_branch:
        description: 'Explicit permitted publication branch'
        required: true
        default: 'astra/autonomous-isles-pilot'
      top_n:
        description: 'Process the next N candidates from the ranked backlog of ONE charter (finishes in-flight ideas first)'
        default: '1'
        required: true
      charter:
        description: 'Charter scope for backlog/candidate selection; empty = baseline'
        default: ''
        required: false
      candidate:
        description: 'Instead: shortlist candidate # from the latest cycle (overrides top_n)'
        default: ''
      idea:
        description: 'Instead: run stages on this existing idea # (overrides both)'
        default: ''
      stages:
        description: 'Stages to run, comma-separated (critique,revise,feasibility,debate)'
        default: 'keystone,critique,debate'
        required: true
      revise_debt:
        description: 'Instead of all the above: batch-sync every REVISE-verdicted idea whose card is stale'
        type: boolean
        default: false

concurrency:
  group: scout-cycle   # same group as the cycle workflow: never run both at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/astra/autonomous-isles-pilot' && inputs.destination_branch == 'astra/autonomous-isles-pilot' && vars.PILOT_REMOTE_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify explicit pilot execution boundary
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
        run: python scripts/workflow_boundary.py verify --source "$SOURCE_SHA" --destination "$DESTINATION_BRANCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Campaign route required
        run: |
          echo 'BLOCKED: legacy numbered-idea workflow is not authorized for this campaign; use the campaign system commands locally.'
          exit 1
