name: idea-pipeline

# Phone-triggerable post-scout pipeline: shortlist the top N candidates of the
# latest completed cycle and run critique + debate on each, or target a
# specific candidate/idea. Idempotent: re-running the same button skips
# already-shortlisted candidates and stages whose artifacts exist, so it
# doubles as resume after a failure or the 6-hour job cap.

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Process the next N candidates from the ranked backlog of ONE charter (finishes in-flight ideas first)'
        default: '1'
        required: true
      charter:
        description: 'Charter scope for backlog/candidate selection; empty = baseline'
        default: ''
        required: false
      candidate:
        description: 'Instead: shortlist candidate # from the latest cycle (overrides top_n)'
        default: ''
      idea:
        description: 'Instead: run stages on this existing idea # (overrides both)'
        default: ''
      stages:
        description: 'Stages to run, comma-separated (critique,revise,feasibility,debate)'
        default: 'keystone,critique,debate'
        required: true
      revise_debt:
        description: 'Instead of all the above: batch-sync every REVISE-verdicted idea whose card is stale'
        type: boolean
        default: false

concurrency:
  group: scout-cycle   # same group as the cycle workflow: never run both at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
          claude --version || true
          codex --version || true

      - name: Restore Codex auth
        run: |
          mkdir -p ~/.codex
          echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Deterministic tests first
        run: python tests/test_orchestration.py

      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"

      - name: Run pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_CI: '1'
        run: |
          ARGS=""
          if [ "${{ inputs.revise_debt }}" = "true" ]; then
            ARGS="--revise-debt"
          elif [ -n "${{ inputs.idea }}" ]; then
            ARGS="--idea ${{ inputs.idea }}"
          elif [ -n "${{ inputs.candidate }}" ]; then
            ARGS="--candidate ${{ inputs.candidate }}"
          else
            ARGS="--top ${{ inputs.top_n }}"
          fi
          if [ -n "${{ inputs.charter }}" ]; then
            ARGS="$ARGS --charter ${{ inputs.charter }}"
          fi
          python scout.py pipeline $ARGS --stages "${{ inputs.stages }}"

      - name: Push checkpoints
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "pipeline: workflow checkpoint"
          if ! git pull --rebase origin ${GITHUB_REF_NAME}; then
            git rebase --abort || true
            echo "::error::rescue rebase conflicted; aborting without committing a conflicted tree"
            exit 1
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
