name: actioner

# Aggregates everything awaiting the human into evidence/actions.md, readable
# on your phone. With propose_improvement enabled, the agent may ALSO author
# at most one pull request (never a commit to main): the PR diff + the checks
# workflow's full test run + your merge button are the approval gate.

on:
  workflow_dispatch:
    inputs:
      propose_improvement:
        description: 'Additionally author ONE improvement PR (prompts/seeds/docs; anything deeper flags itself)'
        type: boolean
        default: false

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  actioner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install agent CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Restore Codex auth
        run: |
          mkdir -p ~/.codex
          echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Deterministic tests first
        run: python tests/test_orchestration.py
      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
      - name: Run actioner (brief)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_CI: '1'
        run: python scout.py actioner ${{ inputs.propose_improvement == true && '--improve' || '' }}
      - name: Author improvement PR (if proposed)
        if: ${{ inputs.propose_improvement == true }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_CI: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LATEST=$(ls -d ideas/actioner-* | sort | tail -1)
          if ! grep -q "## Proposed improvement" "$LATEST/actions.md"; then
            echo "No improvement proposed; skipping PR."
            exit 0
          fi
          BRANCH="actioner/improvement-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          claude -p "You are applying ONE improvement to this repository, exactly as described in the 'Proposed improvement' section of $LATEST/actions.md. Read that section, apply ONLY that change, run 'python tests/test_orchestration.py' and ensure it passes (fix your change, never the tests, if it fails). Allowed targets: orchestrator/prompts/*, orchestrator/seeds.json, docs/*. If the proposal touches scout.py or tests/, keep it single-purpose. NEVER touch .github/workflows/, AGENTS.toml credentials/commands, or the scope/artifact guard logic. Do not change anything not named in the proposal." --allowedTools "Edit,Read,Bash(python*)" --permission-mode acceptEdits || exit 1
          python tests/test_orchestration.py
          git add -A
          git diff --cached --quiet && { echo "Agent made no changes; skipping PR."; exit 0; }
          git commit -m "actioner: proposed improvement (see PR body)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Actioner improvement proposal $(date +%Y-%m-%d)" \
            --body-file <(echo "Automated single-change proposal. Rationale below is from the actioner brief; review the DIFF, not the description. Tests passed on the branch before this PR was opened."; echo; sed -n '/## Proposed improvement/,$p' "$LATEST/actions.md")
      - name: Push checkpoints
        if: always()
        run: |
          git checkout main
          git add -A
          git diff --cached --quiet || git commit -m "actioner: workflow checkpoint"
          if ! git pull --rebase origin ${GITHUB_REF_NAME}; then
            git rebase --abort || true
            echo "::error::rescue rebase conflicted; aborting without committing a conflicted tree"
            exit 1
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
