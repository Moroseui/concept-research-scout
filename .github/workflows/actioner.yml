name: "actioner \u2014 Read the operator brief"
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: System stage (proposals are never automatically adopted)
        type: choice
        options:
        - brief
        default: brief
      experiment:
        description: Registered campaign experiment
        type: choice
        options:
        - P001
        - P002
        - P003
        default: P001
      question:
        description: Question or bounded request; no patient details or credentials
        default: Summarize the evidence, limitations and next action.
        type: string
      request_id:
        description: Reuse to retrieve the same result; change only for a deliberate new attempt
        default: default
        type: string
      source_sha:
        description: Optional exact SHA; blank binds the selected branch revision
        default: ''
        type: string
      destination:
        description: Validated result destination
        type: choice
        options:
        - actions-artifact
        default: actions-artifact
      initiator:
        description: Who is operating this control? (not an approval)
        type: choice
        options:
        - human
        - codex
        default: human
permissions:
  contents: read
  actions: read
jobs:
  control:
    uses: ./.github/workflows/research-control.yml
    with:
      control: actioner
      mode: ${{ inputs.mode }}
      experiment: ${{ inputs.experiment }}
      question: ${{ inputs.question }}
      request_id: ${{ inputs.request_id }}
      source_sha: ${{ inputs.source_sha }}
      destination: ${{ inputs.destination }}
      initiator: ${{ inputs.initiator }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
