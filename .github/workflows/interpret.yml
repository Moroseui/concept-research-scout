name: interpret

# Cross-family adversarial interpretation of an imported results bundle,
# dispatchable from the GitHub mobile app (Actions -> interpret -> Run
# workflow). Mirrors the actioner's execution surface: agent CLIs +
# secrets already provisioned there; deterministic tests run BEFORE any
# agent; every leg's output (including FAILED partial output) is
# committed by interpret-build and pushed fail-closed at the end. This
# stage produces interpretation.md / interpret_review.md / decision.md
# for HUMAN ratification -- it moves no scientific authority by itself.

on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Idea number to interpret (imported bundle required)'
        required: true
        default: '23'

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  interpret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Install agent CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Restore Codex auth
        run: |
          mkdir -p ~/.codex
          echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Deterministic tests first
        run: python tests/test_orchestration.py
      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
      - name: Interpret (cross-family adversarial)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_CI: '1'
        run: python scout.py interpret-build ${{ inputs.idea }}
      - name: Push checkpoints
        if: always()
        run: |
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "rebase conflict: refusing to push from a conflicted tree"
            exit 1
          fi
          git push origin HEAD:main
