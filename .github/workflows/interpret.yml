# Pilot quarantine: legacy model job disabled pending a reviewed campaign workflow.
name: interpret

# Cross-family adversarial interpretation of an imported results bundle,
# dispatchable from the GitHub mobile app (Actions -> interpret -> Run
# workflow). Mirrors the actioner's execution surface: agent CLIs +
# secrets already provisioned there; deterministic tests run BEFORE any
# agent; every leg's output (including FAILED partial output) is
# committed by interpret-build and pushed fail-closed at the end. This
# stage produces interpretation.md / interpret_review.md / decision.md
# for HUMAN ratification -- it moves no scientific authority by itself.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed source commit (40 hex characters)'
        required: true
      destination_branch:
        description: 'Explicit permitted publication branch'
        required: true
        default: 'astra/autonomous-isles-pilot'
      idea:
        description: 'Idea number to interpret (imported bundle required)'
        required: true
        default: '23'
      resume_review:
        description: 'Resume at the review leg (round-1 interpretation preserved from a failed run)'
        type: boolean
        default: false

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  interpret:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/astra/autonomous-isles-pilot' && inputs.destination_branch == 'astra/autonomous-isles-pilot' && vars.PILOT_REMOTE_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify explicit pilot execution boundary
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
        run: python scripts/workflow_boundary.py verify --source "$SOURCE_SHA" --destination "$DESTINATION_BRANCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Campaign route required
        run: |
          echo 'BLOCKED: legacy numbered-idea workflow is not authorized for this campaign; use the campaign system commands locally.'
          exit 1
