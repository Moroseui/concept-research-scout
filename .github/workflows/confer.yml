# Pilot quarantine: legacy model job disabled pending a reviewed campaign workflow.
name: confer

# R5b confer-v0 (TRANSITIONAL: see transitional_debt.yaml). A bounded,
# READ-ONLY, receipted, cross-family REVIEWED exchange about one idea, dispatchable from
# the GitHub mobile app. Grounded on the research card; produces only
# ideas/NNN/confer/ artifacts; touches no authority surface.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed source commit (40 hex characters)'
        required: true
      destination_branch:
        description: 'Explicit permitted publication branch'
        required: true
        default: 'astra/autonomous-isles-pilot'
      idea:
        description: 'Idea number to confer on (CARD.md required)'
        required: true
        default: '23'
      question:
        description: 'Your question (premises get challenged with citations)'
        required: true

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  confer:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/astra/autonomous-isles-pilot' && inputs.destination_branch == 'astra/autonomous-isles-pilot' && vars.PILOT_REMOTE_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify explicit pilot execution boundary
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
        run: python scripts/workflow_boundary.py verify --source "$SOURCE_SHA" --destination "$DESTINATION_BRANCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Campaign route required
        run: |
          echo 'BLOCKED: legacy numbered-idea workflow is not authorized for this campaign; use the campaign system commands locally.'
          exit 1
