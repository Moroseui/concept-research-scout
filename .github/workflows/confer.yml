name: confer

# R5b confer-v0 (TRANSITIONAL: see transitional_debt.yaml). A bounded,
# READ-ONLY, receipted single exchange about one idea, dispatchable from
# the GitHub mobile app. Grounded on the research card; produces only
# ideas/NNN/confer/ artifacts; touches no authority surface.

on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Idea number to confer on (CARD.md required)'
        required: true
        default: '23'
      question:
        description: 'Your question (premises get challenged with citations)'
        required: true

concurrency:
  group: scout-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  confer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Install agent CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Restore Codex auth
        run: |
          mkdir -p ~/.codex
          echo "${{ secrets.CODEX_AUTH_JSON }}" | base64 -d > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Deterministic tests first
        run: python tests/test_orchestration.py
      - name: Git identity
        run: |
          git config user.name  "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
      - name: Confer (read-only exchange)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_CI: '1'
          CONFER_QUESTION: ${{ inputs.question }}
        run: python scout.py confer ${{ inputs.idea }} "$CONFER_QUESTION"
      - name: Push checkpoints
        if: always()
        run: |
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "rebase conflict: refusing to push from a conflicted tree"
            exit 1
          fi
          git push origin HEAD:main
