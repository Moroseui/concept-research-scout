name: Stage existing model secrets for the reviewed environment
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact independently reviewed and approved merged main source
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: model-secret-relocation-20260910-v1
  cancel-in-progress: false
jobs:
  encrypt_for_existing_environment:
    if: ${{ github.repository == 'Moroseui/concept-research-scout' && github.ref == 'refs/heads/main' && github.event_name
      == 'workflow_dispatch' && inputs.source_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install only the locked encryption dependency
      run: 'python -m pip install --only-binary=:all: --require-hashes -r configs/model-secret-relocation-requirements.txt'
    - name: Check current source review and fixed recipient before reading source secrets
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m orchestrator.model_secret_relocation preflight --source "$SOURCE_SHA" --output "$RUNNER_TEMP/relocation-preflight.json"
    - name: Encrypt the three original repository values to GitHub
      env:
        SOURCE_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        SOURCE_CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        SOURCE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python -m orchestrator.model_secret_relocation seal --source "$SOURCE_SHA" --preflight "$RUNNER_TEMP/relocation-preflight.json"
        --output "$RUNNER_TEMP/model-secret-ciphertext/manifest.json"
    - name: Validate the closed ciphertext artifact before upload
      run: python -m orchestrator.model_secret_relocation validate --source "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --manifest
        "$RUNNER_TEMP/model-secret-ciphertext/manifest.json"
    - name: Preserve only the validated ciphertext manifest
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: model-secret-relocation-20260910-v1
        path: ${{ runner.temp }}/model-secret-ciphertext/manifest.json
        if-no-files-found: error
        retention-days: 1
