name: checks
on: [push, pull_request]
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python setup.py
      - run: python -m py_compile scout.py setup.py orchestrator/*.py
      - run: python scout.py doctor
      - run: python tests/test_orchestration.py
      - run: pip install pytest==9.1.1 && python -m pytest -q tests/
      # R2 isolation canary (round-6): selected-class runs must be
      # hermetic; this is the exact selection that exposed the stale
      # fixture-module defect in external review.
      - run: python -m pytest -q tests/test_orchestration.py::TestDebate
      - run: python scout.py state-verify --require-all
      - run: python scout.py registry-validate
