# Round-8 convention: every TRANSITIONAL construct is indexed here with an
# owner and an explicit retirement trigger. Constructs carrying marker: true
# also bear a literal "TRANSITIONAL(<id>)" comment at their code site, and
# TestTransitionalDebt enforces both directions -- a transitional construct
# outliving its ledger, or a ledger entry outliving its construct, fails CI.
