# CLI flags change between versions. Verify with `claude --help` and
# `codex exec --help`, then edit the command lists below.
#
# stdin = true  -> the prompt is piped to the process on stdin.
#                  This is the robust default: no @file syntax, no shell
#                  quoting, no risk of a path being read as literal text.
# stdin = false -> the prompt is substituted into {prompt_text} in the command.

[default]
agent = "claude"

[roles]
scout      = "claude"
critique   = "codex"
revise     = "claude"
debate     = "alternating"   # handled specially: proposer and critic alternate
feasibility = "codex"
probe_plan = "claude"
probe_code = "claude"
interpret  = "codex"
wide_scout = "claude"
fiction_scout = "claude"   # fiction refiner is always the opposite family (derived)
novelty_audit = "codex"

# Which model plays which side during debate rounds.
[debate]
proposer = "claude"
critic   = "codex"
max_rounds = 3

[claude]
enabled = true
stdin = true
command = ["claude", "-p", "--model", "claude-fable-5", "--allowedTools", "Read,Write,Edit,WebSearch,WebFetch,Bash(git:*),Bash(ls:*),Bash(cat:*)", "--permission-mode", "acceptEdits", "--max-turns", "40"]

[codex]
enabled = true
stdin = true
command = ["codex", "exec", "--full-auto", "-"]

# Role rotation: on odd cycle numbers the two families in `pair` swap across
# every role (including debate sides), so each model plays scout and critic
# across cycles. Disable to pin roles exactly as written above.
[rotation]
enabled = true
pair = ["claude", "codex"]

# Operational limits. stage_timeout is per agent invocation, in seconds.
[limits]
stage_timeout = 3600
