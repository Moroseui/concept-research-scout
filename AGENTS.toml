# CLI flags change between versions. Verify with `claude --help` and
# `codex exec --help`, then edit the command lists below.
#
# stdin = true  -> the prompt is piped to the process on stdin.
#                  This is the robust default: no @file syntax, no shell
#                  quoting, no risk of a path being read as literal text.
# stdin = false -> the prompt is substituted into {prompt_text} in the command.

[default]
agent = "claude"

[roles]
scout      = "claude"
critique   = "codex"
revise     = "claude"
debate     = "alternating"   # handled specially: proposer and critic alternate
feasibility = "codex"
probe_plan = "claude"
probe_code = "claude"
interpret  = "codex"
wide_scout = "claude"
fiction_scout = "claude"   # fiction refiner is always the opposite family (derived)
novelty_audit = "codex"
librarian = "claude"
actioner = "claude"
context_memo = "claude"   # A1: WebFetch extraction; checker-mode, human-ratified

# Which model plays which side during debate rounds.
[debate]
proposer = "claude"
critic   = "codex"
max_rounds = 3

[claude]
enabled = true
stdin = true
# D1 (2026-08-14): same-family fallback chain, strongest reasoner first
# (operator decision: maximize per-stage quality, no quota conservation).
# Second entry is the account's Sonnet 5 -- REPLACE the placeholder below
# with the exact string from /model before relying on it; an unavailable
# entry is skipped at runtime (classified, quarantined, next model tried).
# Chain must stay same-family: cross-family fallback is forbidden for
# adversarial stages (FAMILY_OPPOSITIONS in scout.py).
fallback_models = ["claude-opus-4-8"]
command = ["claude", "-p", "--model", "claude-fable-5", "--allowedTools", "Read,Write,Edit,WebSearch,WebFetch,Bash(git:*),Bash(ls:*),Bash(cat:*)", "--permission-mode", "acceptEdits", "--max-turns", "40"]

[codex]
enabled = true
stdin = true
command = ["codex", "exec", "-s", "workspace-write", "-c", "sandbox_workspace_write.network_access=true", "-"]
# On GitHub Actions runners, codex's own sandbox (bubblewrap) cannot initialize
# (unprivileged user-namespace restrictions: uid-map / loopback failures).
# The ephemeral runner VM is itself the sandbox, which is the documented use
# case for the bypass flag. Selected only when SCOUT_CI is set; local runs
# keep the normal sandbox above.
command_ci = ["codex", "exec", "--dangerously-bypass-approvals-and-sandbox", "-"]

# Role rotation: on odd cycle numbers the two families in `pair` swap across
# every role (including debate sides), so each model plays scout and critic
# across cycles. Disable to pin roles exactly as written above.
[rotation]
enabled = true
pair = ["claude", "codex"]

# Operational limits. stage_timeout is per agent invocation, in seconds.
[limits]
stage_timeout = 3600
